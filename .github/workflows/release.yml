name: Release DeepScribe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Zonder deze controle levert een vergeten versiebump een release op waarvan
      # latest.yml de oude versie adverteert, waardoor niemand de update aangeboden krijgt.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint & tests
        run: |
          npm run lint
          npm test
          npm run seescribe:test

      - name: Build frontend & package Electron app
        run: npm run app:build

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist-electron/DeepScribe-Setup.exe
            dist-electron/DeepScribe-Setup.exe.blockmap
            dist-electron/latest.yml




